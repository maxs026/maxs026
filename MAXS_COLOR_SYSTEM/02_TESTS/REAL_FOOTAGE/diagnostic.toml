contexte = """Diagnostic rédigé sur v1.0 ; vérifié en v1.1 : mesures identiques à 0,001 près (la correction moteur v1.1 ne touche que les couleurs extrêmes, absentes de ces plans).
Identification : les deux rushes sont compatibles Apple Log (ProRes 422 HQ, iPhone 15 Pro Max, BT.2020, transfert non standard). Plage vidéo déduite des données pour IMG_7068 (noir mesuré ≈ noir Apple Log) ; supposée pour IMG_7073 (pas de noir dans l'image, même appareil et réglages).
Base technique : ACES 2.0 SDR Rec.709 (NON-APPLE) — la LUT officielle Apple n'est pas fournie.
Les looks ont été conçus pour se placer après la LUT Apple : ce diagnostic est à confirmer avec elle.
Rushes : Paris, 26/09/2026, iPhone 15 Pro Max, ProRes 422 HQ Apple Log, plans verticaux.
IMG_7068 (15h23) : ciel couvert, Seine, pont, bateau-mouche à coque blanche.
IMG_7073 (16h22) : soleil voilé et nuages, façade de l'Île Saint-Louis, arbres, quai en pierre claire.
Non couverts par ces rushes : tons chair exploitables (passagers trop petits, ~0,1 % des pixels),
nuit, golden hour, blancs proches de 1.0 (la coque blanche plafonne vers 0,8 après ACES 2.0).
Les notes valent pour ces deux rushes de jour, pas pour tous les usages."""

recommandation_globale = """MAXS_Natural est le plus polyvalent : sur les deux rushes il reste fidèle à la base (chroma du ciel ×1,01,
végétation ×0,97, aucun décalage de teinte mesurable, aucun écrêtage, noirs intacts) tout en ajoutant un léger
contraste (+4 %). MAXS_Paris est le plus proche de l'intention esthétique de ces plans (architecture, Seine, pierre),
mais il vide le ciel bleu (-35 à -47 % de chroma) et renforce le bruit chroma dans les ombres ensoleillées
(+28 à +38 %) : à corriger avant d'en faire un look par défaut."""

