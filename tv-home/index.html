<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil TV</title>
<style>
/* Léger par conception : pas d'image, pas de blur, pas d'ombre animée.
   Seuls transform et opacity sont animés (composités par le GPU). */
:root{--bg:#05070b;--fg:#f2f4f8;--dim:#8b93a3;--accent:#6ee7d8}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{
  background-color:var(--bg);
  background-image:radial-gradient(ellipse at 20% 0%,#10222b 0%,transparent 55%),
                   radial-gradient(ellipse at 90% 100%,#1a1230 0%,transparent 50%);
  color:var(--fg);font:400 24px/1.2 system-ui,sans-serif;padding:5vh 6vw;
  display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:flex-end}
#time{font-size:72px;font-weight:200;letter-spacing:-1px}
#date{font-size:24px;color:var(--dim);margin-top:6px;text-transform:capitalize}
#wx{font-size:32px;font-weight:300;text-align:right}
#wx small{display:block;font-size:20px;color:var(--dim);margin-top:6px}
#name{margin:8vh 0 3vh;font-size:40px;font-weight:300;height:48px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2.2vw}
.tile{
  aspect-ratio:16/10;border-radius:20px;display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:600;color:#fff;transform:scale(1);opacity:.78;
  transition:transform .12s ease-out,opacity .12s ease-out;will-change:transform}
.tile.on{transform:scale(1.08);opacity:1;outline:4px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<header>
  <div><div id="time">--:--</div><div id="date"></div></div>
  <div id="wx"></div>
</header>
<div id="name"></div>
<main id="grid"></main>
<script>
/* ===== Réglages ===== */
var CONFIG = {
  // Météo : Open-Meteo, sans clé. Remplace par les coordonnées de ta ville.
  city: "Bordeaux", lat: 44.84, lon: -0.58,
  // Raccourcis : nom, adresse, couleur de la tuile.
  apps: [
    {n: "YouTube", u: "https://www.youtube.com/tv", c: "#c4302b"},
    {n: "Netflix", u: "https://www.netflix.com", c: "#b81d24"},
    {n: "Twitch",  u: "https://www.twitch.tv", c: "#6441a5"},
    {n: "Prime Video", u: "https://www.primevideo.com", c: "#146eb4"},
    {n: "Disney+", u: "https://www.disneyplus.com", c: "#1a3a8a"},
    {n: "Canal+",  u: "https://www.canalplus.com", c: "#222"},
    {n: "Google",  u: "https://www.google.com", c: "#2b6cb0"},
    {n: "Météo",   u: "https://www.meteofrance.com", c: "#0e7490"},
    {n: "Actus",   u: "https://www.francetvinfo.fr", c: "#9a3412"},
    {n: "Foot",    u: "https://www.lequipe.fr", c: "#15803d"}
  ],
  cols: 5
};

/* ===== Grille ===== */
var grid = document.getElementById("grid"), label = document.getElementById("name"), tiles = [], cur = 0;
CONFIG.apps.forEach(function (a) {
  var t = document.createElement("div");
  t.className = "tile"; t.textContent = a.n; t.style.background = a.c;
  grid.appendChild(t); tiles.push(t);
});
grid.style.gridTemplateColumns = "repeat(" + CONFIG.cols + ",1fr)";
function focus(i) {
  tiles[cur].classList.remove("on");
  cur = i; tiles[cur].classList.add("on");
  label.textContent = CONFIG.apps[cur].n;
}
focus(0);

/* Flèches de la télécommande (Tizen et navigateurs standards) + OK */
document.addEventListener("keydown", function (e) {
  var n = tiles.length, c = CONFIG.cols, k = e.keyCode, i = cur;
  if (k === 39) i = Math.min(cur + 1, n - 1);
  else if (k === 37) i = Math.max(cur - 1, 0);
  else if (k === 40) i = cur + c < n ? cur + c : cur;
  else if (k === 38) i = cur - c >= 0 ? cur - c : cur;
  else if (k === 13) { location.href = CONFIG.apps[cur].u; return; }
  else return;
  e.preventDefault();
  if (i !== cur) focus(i);
});

/* ===== Heure : une mise à jour par minute, pas par seconde ===== */
var elT = document.getElementById("time"), elD = document.getElementById("date"), lastMin = -1;
function tick() {
  var d = new Date(), m = d.getMinutes();
  if (m !== lastMin) {
    lastMin = m;
    elT.textContent = ("0" + d.getHours()).slice(-2) + ":" + ("0" + m).slice(-2);
    elD.textContent = d.toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"});
  }
}
tick(); setInterval(tick, 10000);

/* ===== Météo : une requête toutes les 30 min ===== */
var elW = document.getElementById("wx");
function weather() {
  var x = new XMLHttpRequest();
  x.open("GET", "https://api.open-meteo.com/v1/forecast?latitude=" + CONFIG.lat + "&longitude=" + CONFIG.lon +
    "&current=temperature_2m,weather_code&timezone=auto");
  x.onload = function () {
    try {
      var c = JSON.parse(x.responseText).current, w = c.weather_code;
      var txt = w === 0 ? "Dégagé" : w < 4 ? "Nuageux" : w < 50 ? "Brouillard" : w < 70 ? "Pluie" :
                w < 80 ? "Neige" : w < 95 ? "Averses" : "Orage";
      elW.innerHTML = Math.round(c.temperature_2m) + "°C<small>" + txt + " · " + CONFIG.city + "</small>";
    } catch (e) {}
  };
  x.send();
}
weather(); setInterval(weather, 30 * 60 * 1000);
</script>
</body>
</html>
